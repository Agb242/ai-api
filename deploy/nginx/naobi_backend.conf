# Noabi API — naobi.api.checkflow.space → PM2 localhost:3020
# Install: copy to /etc/nginx/sites-available/ and reload nginx.
#
# IMPORTANT: Do not list Allow-Headers without X-Org-ID — the SPA sends it on every org-scoped call.
# Either use this file OR let Koa (@koa/cors) set CORS (remove add_header + proxy_hide_header below).

server {
    server_name naobi.api.checkflow.space;

    client_max_body_size 50M;

    # Reflect browser origin for credentialed requests (cookie + Authorization).
    set $cors_allow_origin "";
    if ($http_origin ~* ^https://noabi\.checkflow\.space$) {
        set $cors_allow_origin $http_origin;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Cache-Control, X-Requested-With, Content-Type, Accept, Accept-Language, Authorization, X-API-Key, X-Org-ID, x-org-id, X-Correlation-ID" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Cache-Control, X-Requested-With, Content-Type, Accept, Accept-Language, Authorization, X-API-Key, X-Org-ID, x-org-id, X-Correlation-ID" always;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;

        proxy_pass http://127.0.0.1:3020;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/naobi.api.checkflow.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naobi.api.checkflow.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = naobi.api.checkflow.space) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name naobi.api.checkflow.space;
    return 404;
}
