name: noabi Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - '**'
  pull_request:
    branches: [main]
    paths:
      - '**'

defaults:
  run:
    working-directory: .

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: noabi_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: noabi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: noabi_test
      DB_PASS: test_password
      DB_NAME: noabi_test_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      ENCRYPTION_KEY: test_encryption_key_change_me
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test -- --ci --coverage --forceExit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t noabi-backend:${{ github.sha }} .

      - name: Test Docker image health
        run: |
          docker run -d --name noabi-test \
            -e NODE_ENV=test \
            -e ENCRYPTION_KEY=test \
            -e DB_HOST=127.0.0.1 \
            -e DB_NAME=noabi \
            -e DB_USER=postgres \
            -e DB_PASS=postgres \
            -p 3018:3018 \
            noabi-backend:${{ github.sha }} || true
          sleep 3
          docker stop noabi-test || true
