name: knotflowai Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'knotflowai_backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'knotflowai_backend/**'

defaults:
  run:
    working-directory: knotflowai_backend

jobs:
  # ─── Lint & Type Check ─────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: knotflowai_backend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ─── Unit Tests ────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: knotflowai_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: knotflowai_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://knotflowai_test:test_password@localhost:5432/knotflowai_test_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test_jwt_secret
      JWT_REFRESH_SECRET: test_jwt_refresh_secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: knotflowai_backend/package-lock.json

      - run: npm ci
      - run: npm test -- --ci --coverage --forceExit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: knotflowai_backend/coverage/

  # ─── Docker Build ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t knotflowai-backend:${{ github.sha }} .
        working-directory: knotflowai_backend

      - name: Test Docker image
        run: |
          docker run -d --name knotflowai-test \
            -e NODE_ENV=test \
            -e JWT_SECRET=test \
            -e JWT_REFRESH_SECRET=test \
            -p 3001:3001 \
            knotflowai-backend:${{ github.sha }}
          sleep 5
          curl -f http://localhost:3001/health || exit 1
          docker stop knotflowai-test
